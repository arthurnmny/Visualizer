<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Baby Status</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #202124;
      --muted: #686f75;
      --line: #d9d4cc;
      --paper: #fffaf2;
      --soft: #f4eadb;
      --accent: #8f6f52;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font-family: Arial, Helvetica, sans-serif;
      line-height: 1.5;
    }

    .page {
      width: min(1100px, calc(100% - 32px));
      margin: 0 auto;
      padding: 32px 0 56px;
    }

    header {
      padding: 28px 0;
      border-bottom: 1px solid var(--line);
    }

    .eyebrow {
      margin: 0 0 8px;
      color: var(--accent);
      font-size: 0.8rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(2.4rem, 8vw, 5.8rem);
      line-height: 1.1;
    }

    .status-text {
      margin: 18px 0 0;
      font-size: clamp(1.6rem, 4vw, 2.4rem);
      color: var(--accent);
      font-weight: 700;
    }

    .form-wrap {
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.45);
      padding: 18px;
      margin-top: 30px;
      display: flex;
      justify-content: flex-start;
    }

    .button {
      display: inline-flex;
      min-height: 44px;
      align-items: center;
      justify-content: center;
      padding: 0 16px;
      border: 1px solid var(--accent);
      background: var(--accent);
      color: white;
      text-decoration: none;
      cursor: pointer;
      font: inherit;
    }

    @media (max-width: 760px) {
      .page { padding: 24px 0 40px; }
    }
  </style>
</head>
<body>
  <main class="page">
    <header>
      <p class="eyebrow">Baby status</p>
      <h1>Has the baby been born?</h1>
      <p class="status-text">No</p>
    </header>

    <div class="form-wrap">
      <a class="button" href="baby.html">Back</a>
    </div>
  </main>
</body>
</html>
